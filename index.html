<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard Prototype</title>
    <style>
        :root {
            --bg-app: #0b0f19;
            --bg-sidebar: #111827;
            --bg-card: #1f2937;
            --border: #374151;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #10b981;
            --accent-hover: #059669;
            --radius: 8px;
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* SIDEBAR NAVIGATION */
        aside {
            width: 240px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            color: var(--accent);
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-item a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            display: block;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-item.active a, .nav-item a:hover {
            background-color: var(--bg-card);
            color: var(--text-main);
        }

        /* MAIN CONTENT AREA */
        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-action {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-action:hover {
            background-color: var(--accent-hover);
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        /* DATA DISPLAY & LOGS */
        .panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
        }

        .panel-title {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .log-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-item {
            padding: 0.5rem 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent);
            font-size: 0.875rem;
            border-radius: 0 var(--radius) var(--radius) 0;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>

    <aside>
        <div class="logo">⚡ CoreDash</div>
        <ul class="nav-links">
            <li class="nav-item active"><a href="#">Overview</a></li>
            <li class="nav-item"><a href="#">Analytics</a></li>
            <li class="nav-item"><a href="#">Settings</a></li>
        </ul>
    </aside>

    <main>
        <header>
            <div>
                <h1>System Overview</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Live operation control unit</p>
            </div>
            <button id="triggerEvent" class="btn-action">Simulate Event</button>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Requests Processed</div>
                <div id="reqCount" class="stat-value">1,204</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Server Load</div>
                <div id="serverLoad" class="stat-value">24%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Uptime</div>
                <div class="stat-value">99.98%</div>
            </div>
        </section>

        <section class="panel">
            <h2 class="panel-title">Live System Logs</h2>
            <ul id="logContainer" class="log-list">
                <li class="log-item">System successfully initialized.</li>
                <li class="log-item">Connected to Global Edge CDN network nodes.</li>
            </ul>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('triggerEvent');
            const reqDisplay = document.getElementById('reqCount');
            const loadDisplay = document.getElementById('serverLoad');
            const logContainer = document.getElementById('logContainer');

            let requests = 1204;

            // Interactive Event Simulator
            btn.addEventListener('click', () => {
                requests += Math.floor(Math.random() * 10) + 1;
                reqDisplay.textContent = requests.toLocaleString();

                const newLoad = Math.floor(Math.random() * 60) + 15;
                loadDisplay.textContent = `${newLoad}%`;

                const log = document.createElement('li');
                log.className = 'log-item';
                log.textContent = `[${new Date().toLocaleTimeString()}] Batch process completed. Load balanced to ${newLoad}%.`;
                logContainer.prepend(log);
            });

            // Subtle simulated background activity
            setInterval(() => {
                requests += 1;
                reqDisplay.textContent = requests.toLocaleString();
            }, 3000);
        });
    </script>
</body>
</html>
