<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Performance Sample Page</title>
    <style>
        /* CSS RESET & VARIABLES */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #fafafa;
            --surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border: #e5e7eb;
            --radius: 12px;
            --transition: all 0.2s ease-in-out;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0f172a;
                --surface: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border: #334155;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* CARD UI COMPONENT */
        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            text-align: center;
        }

        .icon-wrapper {
            background-color: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.025em;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        /* PERFORMANCE OPTIMIZED BUTTON */
        .btn {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            will-change: transform;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .counter-display {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .counter-number {
            color: var(--primary);
            font-weight: 700;
        }
    </style>
</head>
<body>

    <!-- SEMANTIC UI STRUCUTRE -->
    <main class="card">
        <div class="icon-wrapper" aria-hidden="true">⚡</div>
        <h1>Deploy Ready</h1>
        <p>This is a blazing fast template optimized for core web vitals and crisp, minimal aesthetics.</p>
        
        <button id="interactiveBtn" class="btn" type="button">Test Interaction</button>
        
        <div class="counter-display">
            Button clicked: <span id="counter" class="counter-number">0</span> times
        </div>
    </main>

    <!-- NON-BLOCKING DOM INTERACTION -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('interactiveBtn');
            const counter = document.getElementById('counter');
            let count = 0;

            button.addEventListener('click', () => {
                count++;
                counter.textContent = count;
            });
        });
    </script>
</body>
</html>
